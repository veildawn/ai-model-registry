# Refresh every provider once an hour.
#
# One run, one commit. A matrix cell per provider re-downloads the upstream and
# pushes on its own, and thirty of those do not finish inside the hour. The
# script already walks providers/*.json when it is given no --provider.
#
# MiMo, StepFun, and Vercel publish catalogs the litellm pass does not own.
# Those three scripts run first, and a failure there is a warning: one vendor's
# docs being down must not stop every other provider. A manual dispatch may
# name one provider; an empty name is the hourly schedule and syncs them all.
#
# The daily sync-prices job runs the same price sync so it can keep the
# price-drift issue. Both jobs share the sync-registry lock so they cannot
# push over each other.
name: sync every provider hourly

on:
  schedule:
    # Off :00. GitHub queues every cron in the world at the top of the hour.
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "One provider to sync (optional). Empty syncs every provider."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-registry
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pull latest main
        run: git pull --rebase origin main || true

      - name: sync mimo catalog
        if: ${{ !github.event.inputs.provider || github.event.inputs.provider == 'mimo' }}
        run: python3 scripts/sync_mimo.py || echo "::warning::mimo catalog sync failed; continuing with the price sync"

      - name: sync stepfun catalog
        if: ${{ !github.event.inputs.provider || github.event.inputs.provider == 'stepfun' }}
        run: python3 scripts/sync_stepfun.py || echo "::warning::stepfun catalog sync failed; continuing with the price sync"

      - name: sync vercel catalog
        if: ${{ !github.event.inputs.provider || github.event.inputs.provider == 'vercel' }}
        run: python3 scripts/sync_vercel.py || echo "::warning::vercel catalog sync failed; continuing with the price sync"

      - name: sync prices
        id: sync
        env:
          SYNC_PROVIDER: ${{ github.event.inputs.provider }}
        run: |
          set +e
          if [ -n "${SYNC_PROVIDER}" ]; then
            python3 scripts/sync_prices.py --provider "${SYNC_PROVIDER}"
          else
            python3 scripts/sync_prices.py
          fi
          code=$?
          set -e
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 2 ]; then
            echo "sync_prices.py could not read the upstream file" >&2
            exit 1
          fi

      - name: regenerate the bundle
        if: steps.sync.outputs.code != '2'
        run: python3 scripts/bundle.py

      - name: check for changes
        id: check_changes
        if: steps.sync.outputs.code != '2'
        run: |
          if [ -n "$(git status --porcelain providers all.json all.json.sig)" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: sign the bundle
        if: steps.check_changes.outputs.changed == '1'
        env:
          AI_PROXY_REGISTRY_SIGNING_SEED: ${{ secrets.AI_PROXY_REGISTRY_SIGNING_SEED }}
        run: |
          set -euo pipefail
          if [ -z "${AI_PROXY_REGISTRY_SIGNING_SEED:-}" ]; then
            echo "::error::AI_PROXY_REGISTRY_SIGNING_SEED is not set. The proxy refuses an unsigned bundle, so this job cannot push one."
            exit 1
          fi
          python3 scripts/sign_bundle.py
          python3 scripts/sign_bundle.py --check

      - name: commit and push
        if: steps.check_changes.outputs.changed == '1'
        env:
          SYNC_PROVIDER: ${{ github.event.inputs.provider }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers all.json all.json.sig
          if [ -n "${SYNC_PROVIDER}" ]; then
            git commit -m "chore(${SYNC_PROVIDER}): auto sync models, rates, and reasoning levels"
          else
            git commit -m "chore: hourly sync of every provider"
          fi
          git pull --rebase origin main || true
          git push origin main
