# A push to main that can move the live bundle must leave it signed.
#
# Consumers fetch all.json over HTTP from a mutable ref, and the proxy refuses a
# bundle whose signature does not verify against the key pinned in its own
# binary. The two sync jobs sign what they write, but a hand-merged PR that
# touches providers/ or all.json never runs them: the committed signature then
# describes bytes that are no longer there, and nothing notices until a consumer
# rejects the bundle and falls back to its embedded snapshot — the silent stale
# fact this layout exists to prevent.
#
# So every push that can move the bundle regenerates it from the files beside
# it, signs it with the repository secret, and commits the pair when either one
# actually changed. A push made with the default GITHUB_TOKEN does not trigger
# workflows, so the commit this job writes cannot call itself, and the sync
# jobs' own pushes simply pass the same check a second time.
name: keep the published bundle signed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sign-bundle.yml"
      - "all.json"
      - "all.json.sig"
      - "index.json"
      - "keys/registry-signing.pub"
      - "providers/**"
      - "scripts/bundle.py"
      - "scripts/ed25519.py"
      - "scripts/sign_bundle.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sign-bundle
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: regenerate the bundle
        run: python3 scripts/bundle.py

      - name: sign the bundle
        env:
          AI_PROXY_REGISTRY_SIGNING_SEED: ${{ secrets.AI_PROXY_REGISTRY_SIGNING_SEED }}
        run: |
          set -euo pipefail
          if [ -z "${AI_PROXY_REGISTRY_SIGNING_SEED}" ]; then
            echo "::error::AI_PROXY_REGISTRY_SIGNING_SEED is not set. A push that moves the bundle cannot be left unsigned: the proxy refuses a bundle whose signature does not verify. Run 'python3 scripts/sign_bundle.py --keygen', store the seed as that secret, and commit the printed public key as keys/registry-signing.pub."
            exit 1
          fi
          python3 scripts/sign_bundle.py
          python3 scripts/sign_bundle.py --check

      - name: commit the pair when it moved
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain all.json all.json.sig)" ]; then
            echo "bundle and signature already agree; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add all.json all.json.sig
          git commit --file - <<'MSG'
          chore: regenerate and sign the published bundle

          Applied by .github/workflows/sign-bundle.yml, which runs whenever a
          push to main can move the bundle. all.json is regenerated from the
          files it is built from, and all.json.sig signs the digest of the bytes
          committed beside it, so a consumer can tell this repository's bundle
          from anything else answering on that URL.
          MSG
          git pull --rebase origin main
          git push
